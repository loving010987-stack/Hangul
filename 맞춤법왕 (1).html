<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>알쏭달쏭 맞춤법 왕</title>
<!--
  ■ 알쏭달쏭 맞춤법 왕을 찾아라!  (초등 5~6학년 국어 · 맞춤법 복습)
  ■ 놀이 흐름
      한글 나라 지도 → 마을 5곳(마을마다 5문제, 맞힌 수준에 따라 별 1~3개)
      → 다섯 마을을 모두 통과하면 집현전이 열림 → 집현전 시험 통과
      → 이름 쓰기 → 세종대왕 상 → 집현전에서 인증서 발급
  ■ 이 파일만 있으면 돼요. 인터넷이 없어도 열리고, 글꼴(주아체·고운돋움, SIL OFL 1.1)은 파일 끝에 들어 있어요.
  ■ 학생 정보는 인증서에 쓰는 이름 하나만 받고, 저장하거나 보내지 않아요. 새로고침하면 처음으로 돌아가요.
  ■ 문제 고치기: 스크립트 앞부분 BANK 목록에서 한 줄씩 고치거나 더하면 돼요.
      g = 마을 번호(s1~s5), s = 문장(빈칸은 ___), a = 정답, w = 오답, why = 해설, tip = 꿀팁(선택)
  ■ 전자칠판 시범용 키보드: 숫자 1·2로 보기 고르기, Enter로 다음 문제
-->
<style>
/* ─────────────────────────────────────────────
   콘셉트: 받아쓰기 공책
   모눈 종이 바탕 · 원고지 칸 제목 · 빨간 펜 채점 · 수준별 별
   ───────────────────────────────────────────── */
:root {
  color-scheme: light;
  --paper: #FAFDF6;
  --grid: rgba(20, 163, 143, .09);
  --ink: #17403A;
  --ink-soft: #4C6762;
  --teal: #14A38F;
  --teal-deep: #0B7465;
  --mint: #DFF4EC;
  --leaf: #93CF4E;
  --leaf-pale: #F0F9E2;
  --leaf-deep: #4C860F;
  --pen: #E0483E;
  --pen-pale: #FDECEA;
  --gold: #F6C343;
  --gold-pale: #FFF7DC;
  --rule: #CFE6DE;
  --white: #FFFFFF;
  --navy: #22406E;
  --face: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --text: "Gowun Dodum", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --tiny: max(14px, .78rem);
  --space: clamp(10px, 1.8vh, 18px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; font-size: clamp(17px, .5vw + 13px, 24px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; height: 100%; display: flex; flex-direction: column;
  font-family: var(--text); line-height: 1.6; color: var(--ink);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  word-break: keep-all; overflow-wrap: break-word; overflow-x: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
.face { font-family: var(--face); font-weight: 400; }
.gi { width: 1.1em; height: 1.1em; flex: none; vertical-align: -.18em; }

/* ── 머리줄 ── */
.bar {
  flex: none; display: flex; align-items: center; gap: 12px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--white); border-bottom: 3px solid var(--ink);
}
.bar .mark svg { width: 40px; height: 40px; display: block; }
.bar .name { font-family: var(--face); font-size: 1.15rem; color: var(--teal-deep); white-space: nowrap; }
.bar .where { font-size: var(--tiny); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bar .sp { flex: 1; }
.snd {
  display: inline-flex; align-items: center; gap: 6px; min-height: 46px; padding: 4px 14px;
  border: 2px solid var(--ink); border-radius: 999px; background: var(--white); font-family: var(--face);
}
.snd[aria-pressed="true"] { background: var(--leaf-pale); }
@media (max-width: 520px) { .bar .where, .snd .t { display: none; } }

/* ── 무대 ── */
main { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; }
.scene {
  width: 100%; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space);
  padding-block: clamp(10px, 2.2vh, 24px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
/* 가운데 두되, 내용이 길면 위가 잘리지 않고 아래로 스크롤 */
.scene::before, .scene::after { content: ""; flex: 1 0 0; }
.scene::before { margin-bottom: calc(-1 * var(--space)); }
.scene::after { margin-top: calc(-1 * var(--space)); }
.sheet { background: var(--white); border: 3px solid var(--ink); border-radius: 18px; }

/* 버튼: 테두리 + 비스듬한 그림자(도장 찍듯 눌림) */
.go {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 62px; padding: 8px 26px; border: 3px solid var(--ink); border-radius: 16px;
  background: var(--teal); color: var(--white); font-family: var(--face); font-size: 1.2rem;
  box-shadow: 5px 5px 0 var(--ink); transition: transform .07s, box-shadow .07s;
}
.go:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 var(--ink); }
.go.plain { background: var(--white); color: var(--ink); }
.go.leaf { background: var(--leaf); color: var(--ink); }
.go.gold { background: var(--gold); color: var(--ink); }
.go.huge { min-height: 76px; padding: 8px 40px; font-size: 1.5rem; border-radius: 20px; }
.gos { flex: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 18px; }

/* ── 첫 화면 ── */
.open { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: center; gap: clamp(16px, 3vw, 44px); }
.open .left { display: grid; gap: clamp(12px, 2.4vh, 24px); justify-items: start; }
.wongo { display: grid; gap: 8px; }
.wongo .ln { display: flex; }
.wongo .c {
  width: clamp(44px, 6vw, 92px); aspect-ratio: 1; display: grid; place-items: center;
  border: 2px solid #9ACFC2; margin-left: -2px; background: rgba(255, 255, 255, .85);
  font-family: var(--face); font-size: clamp(1.9rem, 4.4vw, 4.2rem); line-height: 1; color: var(--ink);
}
.wongo .ln .c:first-child { margin-left: 0; }
.wongo .c.hl { color: var(--pen); }
.wongo .c.em { background: transparent; }
.open .lead { font-size: 1.12rem; max-width: 28em; }
.open .lead b { font-family: var(--face); font-weight: 400; color: var(--teal-deep); }
.open .art svg { width: 100%; height: auto; display: block; max-height: 62vh; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.awards { display: grid; gap: 8px; width: 100%; max-width: 36em; padding: 10px 14px; border: 2px dashed var(--ink); border-radius: 14px; background: rgba(255, 255, 255, .9); }
.aw-h { font-family: var(--face); font-size: 1rem; color: var(--teal-deep); }
.awards ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.awards li { display: grid; justify-items: center; gap: 2px; padding: 6px 4px; border-radius: 10px; background: var(--paper); text-align: center; line-height: 1.25; }
.awards .dot { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--ink); box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .55); }
.awards b { font-family: var(--face); font-weight: 400; font-size: 1.1rem; }
.awards small { font-size: 13px; color: var(--ink-soft); }
@media (max-width: 520px) { .awards ul { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.chip { padding: 2px 12px; border-radius: 8px; background: var(--mint); font-family: var(--face); font-size: var(--tiny); color: var(--teal-deep); }
@media (max-width: 820px) {
  .open { grid-template-columns: 1fr; }
  .open .left { justify-items: center; text-align: center; }
  .open .art { order: -1; max-width: 360px; margin: 0 auto; }
  .chips { justify-content: center; }
}

/* ── 지도 ── */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 16px; }
.head h2 { font-family: var(--face); font-weight: 400; font-size: clamp(1.4rem, 2.6vw, 2rem); line-height: 1.2; }
.head p { color: var(--ink-soft); }
.head .tally { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding: 4px 14px; border: 2px solid var(--ink); border-radius: 12px; background: var(--gold-pale); font-family: var(--face); font-variant-numeric: tabular-nums; }
.map { position: relative; flex: none; width: min(100%, (100vh - 270px) * 1.786); aspect-ratio: 1000 / 560; margin: 0 auto; border: 3px solid var(--ink); border-radius: 22px; overflow: hidden; background: #EAF7EE; }
.map > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.spot { position: absolute; transform: translate(-50%, -50%); width: 17%; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: 0; background: none; }
.spot .ring {
  width: clamp(58px, 7.4vw, 104px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  background: var(--white); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); transition: transform .08s, box-shadow .08s;
}
.spot .ring svg { width: 70%; height: 70%; }
.spot:active .ring { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.spot .tag { display: grid; justify-items: center; padding: 3px 12px 5px; background: var(--white); border: 2px solid var(--ink); border-radius: 10px; line-height: 1.25; white-space: nowrap; }
.spot .tag b { font-family: var(--face); font-weight: 400; font-size: clamp(.9rem, 1.35vw, 1.2rem); }
.spot .tag small { font-size: clamp(12px, .92vw, 15px); color: var(--ink-soft); }
.spot.pass .ring { background: var(--leaf-pale); }
.spot.hint .ring { outline: 4px dashed var(--pen); outline-offset: 5px; }
.spot.king .ring { width: clamp(70px, 9vw, 126px); background: #FFF4E4; }
.spot.shut .ring { filter: grayscale(.9); opacity: .8; }
.spot .key { display: none; }
.spot.shut .key { display: grid; position: absolute; top: -4px; right: 20%; width: clamp(26px, 2.6vw, 36px); aspect-ratio: 1; place-items: center; border-radius: 50%; background: var(--white); border: 2px solid var(--ink); }
.spot.shut .key svg { width: 58%; height: 58%; }
.spot.won .ring { background: var(--gold-pale); }
.stamps { display: inline-flex; gap: 3px; }
.stamps svg { width: 1.35em; height: 1.35em; }
.maptip { text-align: center; color: var(--ink-soft); font-size: var(--tiny); }
.maptip.warn { color: var(--pen); font-family: var(--face); font-size: 1rem; }
@media (max-width: 700px) {
  .map { aspect-ratio: auto; width: 100%; border: 0; background: none; overflow: visible; display: grid; gap: 10px; }
  .map > svg { display: none; }
  .spot { position: static; transform: none; width: 100%; flex-direction: row; gap: 12px; padding: 8px 12px; background: var(--white); border: 3px solid var(--ink); border-radius: 16px; text-align: left; }
  .spot .ring, .spot.king .ring { width: 60px; flex: none; box-shadow: none; }
  .spot .tag { justify-items: start; border: 0; padding: 0; background: none; white-space: normal; }
  .spot.shut .key { position: static; margin-left: auto; order: 3; width: 34px; }
  .head .tally { margin-left: 0; }
}

/* ── 문제 ── */
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.status .vill { font-family: var(--face); font-size: 1.15rem; color: var(--teal-deep); }
.boxes { display: flex; }
.boxes span { width: 40px; height: 40px; margin-left: -2px; border: 2px solid #9ACFC2; background: var(--white); display: grid; place-items: center; font-family: var(--face); font-size: var(--tiny); color: var(--ink-soft); }
.boxes span:first-child { margin-left: 0; }
.boxes span.now { border-color: var(--ink); position: relative; z-index: 1; background: var(--leaf-pale); }
.boxes span svg { width: 30px; height: 30px; }
.status .pts { margin-left: auto; font-family: var(--face); font-size: 1.15rem; padding: 2px 14px; border: 2px solid var(--ink); border-radius: 12px; background: var(--gold-pale); font-variant-numeric: tabular-nums; }
.quest { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px 20px; padding: clamp(12px, 2.8vh, 30px) clamp(16px, 3vw, 38px); }
.quest .pal svg { width: clamp(70px, 10vh, 118px); height: clamp(70px, 10vh, 118px); display: block; }
.quest .ask { font-family: var(--face); font-size: var(--tiny); color: var(--teal-deep); }
.line {
  font-family: var(--face); font-size: clamp(1.6rem, 3.6vw, 2.7rem); line-height: 1.6;
  background-image: linear-gradient(transparent calc(100% - 3px), #BFE0D6 0); background-size: 100% 1.6em;
}
.gap { display: inline-block; min-width: 3.2em; padding: 0 .3em; margin: 0 .1em; line-height: 1.25; text-align: center; border-bottom: 4px solid var(--teal); background: var(--mint); border-radius: 8px 8px 0 0; color: var(--teal-deep); }
.gap.done { background: var(--leaf-pale); border-color: var(--leaf-deep); color: var(--leaf-deep); }
.picks { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(12px, 2vw, 28px); }
.pk {
  position: relative; min-height: clamp(96px, 17vh, 168px); border: 3px solid var(--ink); border-radius: 20px; background: var(--white);
  box-shadow: 6px 6px 0 var(--ink); font-family: var(--face); font-size: clamp(2.1rem, 5vw, 3.7rem); display: grid; place-items: center; padding: 8px 14px;
  transition: transform .07s, box-shadow .07s, background .2s;
}
.pk:active:not(:disabled) { transform: translate(5px, 5px); box-shadow: 1px 1px 0 var(--ink); }
.pk:disabled { cursor: default; }
.pk .no { position: absolute; top: 8px; left: 12px; font-size: var(--tiny); color: var(--ink-soft); }
.pk .grade { position: absolute; inset: 0; pointer-events: none; }
.pk .grade svg { width: 100%; height: 100%; display: block; }
.pk .grade path, .pk .grade ellipse { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw .55s ease-out forwards; }
.pk.yes { background: var(--leaf-pale); }
.pk.oops { background: var(--pen-pale); animation: wobble .4s; }
.pk.fade { opacity: .5; }
.say { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px 14px; min-height: clamp(70px, 11vh, 108px); padding: 10px 18px; }
.say.idle { border-style: dashed; background: rgba(255, 255, 255, .7); grid-template-columns: 1fr; text-align: center; font-family: var(--face); color: var(--ink-soft); font-size: 1.1rem; }
.say.yes { background: var(--leaf-pale); }
.say.oops { background: var(--pen-pale); }
.say .word { font-family: var(--face); font-size: 1.45rem; line-height: 1.3; }
.say.yes .word { color: var(--leaf-deep); }
.say.oops .word { color: var(--pen); }
.say .word small { display: block; font-size: 1.05rem; color: var(--ink); }
.say .act { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; }
.say .go { min-height: 56px; font-size: 1.1rem; padding: 6px 20px; box-shadow: 4px 4px 0 var(--ink); }
.why { grid-column: 1 / -1; display: grid; gap: 6px; padding: 12px 16px; background: var(--white); border: 2px solid var(--ink); border-radius: 12px; }
.why .pair { font-size: 1.15rem; display: flex; gap: 14px; }
.why .lab { font-family: var(--face); color: var(--teal-deep); margin-right: 6px; }
.why .tip { padding: 6px 12px; border-radius: 10px; background: var(--gold-pale); }
.right { font-family: var(--face); color: var(--leaf-deep); }
.wrong { font-family: var(--face); color: var(--pen); text-decoration: line-through; text-decoration-thickness: 2px; }
.pop { position: absolute; top: 6px; left: 50%; font-family: var(--face); font-size: 2rem; color: var(--pen); pointer-events: none; animation: up 1s ease-out forwards; }
@media (max-width: 640px) {
  .quest { grid-template-columns: 1fr; text-align: center; }
  .quest .pal { justify-self: center; }
  .quest .pal svg { width: 66px; height: 66px; }
  .say { grid-template-columns: 1fr; }
  .say .act .go { flex: 1 1 0; }
  .status .pts { margin-left: 0; }
  .boxes span { width: 34px; height: 34px; }
}

/* ── 채점 결과 ── */
.paper2 { flex: 0 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(12px, 2vw, 24px); }
.score { position: relative; display: grid; justify-items: center; align-content: center; text-align: center; gap: 8px; padding: clamp(14px, 2.4vh, 28px) 18px; }
.score .vname { font-family: var(--face); color: var(--teal-deep); font-size: 1.1rem; }
.score .red { font-family: var(--face); font-size: clamp(3.4rem, 8vw, 6rem); line-height: 1; color: var(--pen); transform: rotate(-6deg); }
.score .red small { font-size: .38em; }
.score .cnt { font-family: var(--face); font-size: 1.15rem; }
.score .big svg { width: clamp(56px, 9vh, 86px); height: clamp(56px, 9vh, 86px); }
.score .big { display: flex; gap: 6px; }
.score .big svg.on { animation: thump .45s backwards; }
.score .big svg:nth-child(2) { animation-delay: .15s; }
.score .big svg:nth-child(3) { animation-delay: .3s; }
.score .msg { color: var(--leaf-deep); font-weight: 700; }
.score .rule { font-size: var(--tiny); color: var(--ink-soft); }
.score .pal svg { width: clamp(70px, 11vh, 110px); height: clamp(70px, 11vh, 110px); display: block; }
.wrongs { display: flex; flex-direction: column; min-height: 0; padding: 14px 16px; gap: 10px; }
.wrongs h3 { display: flex; align-items: center; gap: 8px; font-family: var(--face); font-weight: 400; font-size: 1.3rem; }
.wrongs h3 .n { margin-left: auto; font-size: var(--tiny); color: var(--ink-soft); }
.wlist { flex: 1 1 auto; min-height: 110px; max-height: 54vh; overflow-y: auto; display: grid; align-content: start; gap: 10px; padding-right: 4px; }
.wi { padding: 10px 14px; border-left: 6px solid var(--pen); background: #FFFBFA; border-radius: 0 12px 12px 0; display: grid; gap: 4px; }
.wi .src { font-size: 13px; color: var(--teal-deep); font-family: var(--face); }
.wi .q { font-family: var(--face); font-size: 1.12rem; }
.wi .q .gap { min-width: 2.4em; }
.wi .two { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.wi .ex { font-size: .95rem; color: var(--ink-soft); }
.clean { display: grid; place-items: center; text-align: center; gap: 6px; padding: 18px; font-family: var(--face); font-size: 1.25rem; color: var(--leaf-deep); }
.clean svg { width: 104px; height: 110px; }
@media (max-width: 860px) { .paper2 { grid-template-columns: 1fr; } .wlist { max-height: none; overflow: visible; } }

/* ── 집현전: 이름 쓰기 ── */
.sign { width: min(100%, 720px); margin: 0 auto; display: grid; justify-items: center; text-align: center; gap: 14px; padding: clamp(18px, 3.4vh, 36px) 22px; }
.sign .hall svg { width: clamp(120px, 20vh, 200px); height: auto; display: block; }
.sign h2 { font-family: var(--face); font-weight: 400; font-size: clamp(1.6rem, 3.4vw, 2.4rem); color: var(--teal-deep); }
.sign label { font-family: var(--face); font-size: 1.15rem; }
#who { width: min(100%, 360px); min-height: 64px; padding: 6px 16px; border: 3px solid var(--ink); border-radius: 14px; text-align: center; font-family: var(--face); font-size: 1.4rem; background: var(--paper); }
#who:focus { outline: none; box-shadow: 0 0 0 5px rgba(20, 163, 143, .25); }
.sign .note { font-size: var(--tiny); color: var(--ink-soft); }

/* ── 세종대왕 상 ── */
.prize {
  width: min(100%, 860px); margin: 0 auto; display: grid; justify-items: center; text-align: center; gap: 10px;
  padding: clamp(16px, 3vh, 34px) clamp(18px, 4vw, 48px);
  background: #FFFCF2; border: 3px solid #A9802F; border-radius: 10px; box-shadow: inset 0 0 0 9px #FFFCF2, inset 0 0 0 12px #D9B26A;
}
.prize .band { width: 100%; max-width: 540px; aspect-ratio: 560 / 150; }
.prize .band svg { width: 100%; height: 100%; display: block; }
.prize .medal svg { width: clamp(108px, 19vh, 176px); height: clamp(108px, 19vh, 176px); display: block; margin-top: calc(-1 * clamp(40px, 7vh, 62px)); }

.cert .kick { font-family: var(--face); color: var(--teal-deep); }
.cert h2 { font-family: var(--face); font-weight: 400; font-size: clamp(1.9rem, 4vw, 3rem); line-height: 1.15; }
.cert h2 em { font-style: normal; color: var(--pen); }
.cert .person { font-family: var(--face); font-size: clamp(1.4rem, 2.6vw, 2rem); }
.cert .person em { font-style: normal; background: var(--gold-pale); padding: 0 .3em; border-radius: 6px; }
.cert .nums { display: flex; flex-wrap: wrap; gap: 8px 10px; margin: 4px 0; }
.cert .num { display: grid; padding: 4px 14px; border: 2px solid var(--ink); border-radius: 10px; background: var(--white); line-height: 1.3; }
.cert .num small { font-size: 13px; color: var(--ink-soft); }
.cert .num b { font-family: var(--face); font-weight: 400; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.cert .per { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .95rem; }
.cert .per span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.cert .per .stamps svg { width: 1.2em; height: 1.2em; }
.cert .bottom { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding-top: 10px; border-top: 2px solid var(--ink); font-size: var(--tiny); color: var(--ink-soft); }

.snap { text-align: center; font-family: var(--face); color: var(--teal-deep); }
.ladder { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.ladder span { display: grid; justify-items: center; padding: 6px 8px; border: 2px dashed #B9CEC7; border-radius: 12px; line-height: 1.3; text-align: center; color: var(--ink-soft); background: var(--white); }

@media (max-width: 700px) { .ladder { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
a.go { text-decoration: none; }
.modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: rgba(23, 64, 58, .55); }
.mbox { width: min(100%, 980px); max-height: 100%; overflow-y: auto; display: grid; gap: 12px; justify-items: center; padding: 18px; background: var(--white); border: 3px solid var(--ink); border-radius: 18px; text-align: center; }
.mbox h2 { font-family: var(--face); font-weight: 400; font-size: 1.5rem; }
.mbox img { width: 100%; height: auto; max-height: 62vh; object-fit: contain; border: 2px solid var(--rule); border-radius: 8px; -webkit-touch-callout: default; }
.mhelp { font-size: .95rem; color: var(--ink-soft); max-width: 40em; }
.allw { width: min(100%, 1000px); margin: 0 auto; }
@media (max-width: 700px) { .cert { grid-template-columns: 1fr; text-align: center; } .cert .nums, .cert .per { justify-content: center; } }

/* ── 움직임 ── */
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }
@keyframes thump { 0% { transform: scale(.2) rotate(-40deg); opacity: 0; } 70% { transform: scale(1.12) rotate(6deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
@keyframes up { 0% { opacity: 0; transform: translate(-50%, 0); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70px); } }
@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes drop { from { transform: translateY(-8vh) rotate(0); } to { transform: translateY(106vh) rotate(600deg); } }
.sway { animation: sway 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.party { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }

@media (prefers-reduced-motion: reduce) {

<body>

<main id="main">

      <button type="button" class="go plain" id="goReset"></button>

</main>
<div class="party" id="party" aria-hidden="true"></div>
<div class="modal" id="saveBox" role="dialog" aria-modal="true" aria-labelledby="saveTtl" hidden>

  </div>
</div>

  amp.gain.exponentialRampToValueAtTime(0.0001, t + len);

}

/* ▶ 상태와 화면 전환 */
const el = id => document.getElementById(id);
const safe = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function mix(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const game = { name: '', at: null, qs: [], i: 0, ok: 0, locked: false, best: {}, stamps: {}, wrongs: {}, won: false, certNo: '' };

/* 지도 */

/* 문제 풀기 */

}
function choose(k) {

  x.pick = got; x.right = got === x.q.a;

/* 채점 */
function grade() {
  const id = game.at, p = placeOf(id), hall = id === HALL.id, n = game.ok;
  game.best[id] = Math.max(game.best[id] || 0, n);
  const miss = game.qs.filter(x => !x.right);
  game.wrongs[id] = miss.map(x => ({ q: x.q, pick: x.pick, place: p.name }));
  let pass, got = 0, msg;
  if (hall) { pass = n >= HALL_PASS; msg = pass ? T.hallPass : T.hallFail; }
  else {
    got = starsFor(n); pass = got > 0;
    game.stamps[id] = Math.max(game.stamps[id] || 0, got);
    msg = pass ? T.passMsg[got - 1] : T.failMsg;
  }
  el('score').innerHTML = `
    <div class="pal">${buddy(pass ? 'cheer' : 'gasp', hall && pass)}</div>

    <p class="msg">${safe(msg)}</p>

  else gos = `<button type="button" class="go ${pass ? 'plain' : 'huge'}" data-do="again">${G.again} ${T.again}</button>

  el('doneGos').innerHTML = gos;
  el('doneGos').querySelectorAll('button').forEach(b => {
    b.onclick = () => { play('tap'); const d = b.dataset.do; if (d === 'sign') toSign(); else if (d === 'again') startRound(id); else toMap(); };
  });
  go('vDone', `${p.name} · 채점 결과`);
  play('done');
  if (pass && (hall || got === 3)) party();
  const f = el('doneGos').querySelector('.huge') || el('doneGos').querySelector('button');
  if (f) f.focus({ preventScroll: true });

/* ▶ 인증서를 그림 파일(PNG)로 — 화면 캡처 없이 캔버스에 직접 그려요 */
function roundRect(x, X, Y, W, H, r) {

  x.fillStyle = '#2F8A6E'; x.fill(new Path2D(BAND[0]));

async function saveImage(kind) {
  play('tap');

  btn.disabled = true; btn.innerHTML = `${G.down} ${T.saving}`;
  let url = '', blobUrl = '';

    const pz = await drawPrize(), ct = await drawCert(withBuddy);
    // 상장(왼쪽) + 인증서(오른쪽)를 한 장에
    const cv = document.createElement('canvas'), gap = 60, pad = 50;

    const x = cv.getContext('2d');
    x.fillStyle = '#EEF7F2'; x.fillRect(0, 0, cv.width, cv.height);
    x.drawImage(pz, pad, pad);
    x.drawImage(ct, pad + pz.width + gap, pad + (pz.height - ct.height) / 2);
    url = cv.toDataURL('image/png');
    const blob = await new Promise(r => { try { cv.toBlob(r, 'image/png'); } catch (e) { r(null); } });
    if (blob) blobUrl = URL.createObjectURL(blob);
  };
  try { await make(true); } catch (e) { try { await make(false); } catch (e2) { url = ''; } }
  btn.disabled = false; btn.innerHTML = `${G.down} ${label}`;
  if (!url) return;

  const file = `spelling-award-certificate-${game.certNo.replace(/[^0-9-]/g, '')}.png`;
